[project]
name = "synchroni-sensor-sdk"
version = "0.1.0"
description = "SDK for interfacing with Synchroni BLE devices"
url = "https://github.com/SynchroniSI/synchroni-sensor-sdk"
authors = [
    {name = "yecq_82@hotmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"

[tool.poetry]
packages = [
    { include = "sensor" },
]

[tool.poetry.dependencies]
numpy = ">=1.23.0"
bleak = ">=2.1.1,<3.0.0"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.14.14,<0.15.0"
mypy = ">=1.19.1,<2.0.0"
pytest-asyncio = ">=1.3.0,<2.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    ".venv",
    ".venv.local",
    "examples",
    "sensor",
]


[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "UP046", # Python 3.11 forces us to use Generic
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
show_error_codes = true
files = ["entry", "synchroni_tools"]
exclude = [
    "^.venv/",
    "^.venv.local/",
    "^dist/",
]

[[tool.mypy.overrides]]
module = [
    "boto3.*",
    "botocore.*",
    "uuid_extensions",
    "psychopy",
    "psychopy.*",
    "pydub",
    "pydub.*",
    "scipy",
    "scipy.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sensor", "sensor.*"]
ignore_errors = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["synchroni_tools", "synchroni_tools.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["synchroni_tools.backend", "synchroni_tools.backend.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true

[[tool.mypy.overrides]]
module = [
    "app.domain.*.repo.sql",
]
# SQLModel/SQLAlchemy column comparisons return SQL expressions, not bools
# This is a known limitation of static type checking with SQLModel
disable_error_code = ["arg-type", "attr-defined"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
